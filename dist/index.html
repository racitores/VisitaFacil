  <title>Clientes · Caldera Gestión</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>

<body>
  <header class="masthead">
    <div class="wrap masthead-inner">
      <div class="brand"><span class="brand-mark" aria-hidden="true"><svg width="21" height="24" viewBox="0 0 24 28" fill="none"><path d="M13 2c1 6-4 7-4 11-2-1-3-3-3-3-3 3-4 6-4 9a10 8 0 0 0 20 0c0-7-5-9-9-17Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M12 24c-3 0-4-4 0-8 4 4 3 8 0 8Z" fill="currentColor"/></svg></span><div>Caldera Gestión<small>Servicio técnico</small></div></div>
      <nav class="site-nav" aria-label="Navegación principal">
        <a href="./" aria-current="page">Clientes</a>
        <a href="revisiones.html">Revisiones pendientes</a>
      </nav>
      <span class="demo">Datos de prueba</span>
    </div>
  </header>
  <main class="wrap">
    <section class="intro" aria-labelledby="page-title">
      <p class="eyebrow">MANTENIMIENTO</p>

      <p>Consulta los datos de contacto, las direcciones y las intervenciones realizadas.</p>

    <div class="workspace">

        </div>
        <ul id="clients" class="client-list"></ul>
      </section>
      <section id="detail" class="panel detail" aria-label="Ficha del cliente" tabindex="-1">
        <p class="empty">Cargando ficha…</p>
      </section>
    </div>
  </main>
  <footer class="wrap">Caldera Gestión <span>·</span> Registro de servicio técnico</footer>
